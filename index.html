<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 독서왕</title>
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #f6f2e9;
    color: #273d35;
    font-family: system-ui, sans-serif;
  }

  main {
    max-width: 850px;
    margin: auto;
    padding: 24px;
  }

  section {
    background: white;
    padding: 24px;
    border-radius: 20px;
    margin: 20px 0;
  }

  input, textarea, button {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 10px;
    font: inherit;
  }

  textarea { min-height: 140px; }

  button {
    background: #346751;
    color: white;
    border: 0;
    cursor: pointer;
  }

  button:disabled { opacity: .5; }

  .muted, small { color: #68786f; }

  #message {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  #preview { max-width: 120px; }

  #books {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
  }

  .book {
    border: 1px solid #ddd;
    border-radius: 14px;
    overflow: hidden;
  }

  .cover {
    background: #e6eee5;
    min-height: 160px;
    display: grid;
    place-items: center;
    padding: 16px;
    overflow-wrap: anywhere;
  }

  .cover img {
    width: 100%;
    height: 180px;
    object-fit: contain;
  }

  .info {
    padding: 16px;
    overflow-wrap: anywhere;
  }

  .info p { white-space: pre-wrap; }

  footer {
    font-size: 13px;
    color: #68786f;
  }

  [hidden] { display: none !important; }

  @media (max-width: 480px) {
    main { padding: 16px; }
    section { padding: 18px; }
  }
</style>
</head>

<body>
<main>
  <h1>📚 오늘의 독서왕</h1>
  <p id="clock"></p>
  <p id="message" role="status" aria-live="polite"></p>

  <section id="auth">
    <h2>나의 서재에 들어가기</h2>
    <p class="muted">
      로그인하면 다른 기기에서도 내 서재를 볼 수 있어.
    </p>

    <form id="authForm">
      <label for="username">아이디</label>
      <input
        id="username"
        autocomplete="username"
        minlength="2"
        maxlength="30"
        placeholder="한글·영문·숫자·밑줄·하이픈, 2~30글자"
        required
      >

      <label for="password">비밀번호</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        minlength="8"
        maxlength="128"
        placeholder="8글자 이상"
        required
      >

      <button type="submit">로그인</button>
      <button id="signup" type="button">회원가입</button>
    </form>
  </section>

  <div id="app" hidden>
    <section>
      <h2 id="greeting">나의 서재</h2>
      <button id="logout" type="button">로그아웃</button>
    </section>

    <section>
      <h2>✍️ 오늘 읽은 책</h2>

      <form id="bookForm">
        <label for="title">책 제목</label>
        <input id="title" maxlength="150" required>

        <label for="cover">책 표지 사진</label>
        <input id="cover" type="file" accept="image/*">
        <img id="preview" alt="선택한 표지" hidden>

        <p class="muted">
          표지는 저장 공간에 맞게 작은 사진으로 줄어들어.
        </p>

        <label for="review">감상문 또는 줄거리</label>
        <textarea
          id="review"
          maxlength="3000"
          placeholder="어떤 장면이 기억에 남았어?"
        ></textarea>

        <button id="saveBook" type="submit">
          서재에 저장하기
        </button>
      </form>
    </section>

    <section>
      <h2>📖 나의 서재</h2>
      <p id="count"></p>
      <p id="empty">아직 기록한 책이 없어!</p>
      <div id="books"></div>
    </section>
  </div>

  <footer>
    기록은 서버에 저장돼. 여러 기기에서 동시에 저장하지 말아 줘.
    새로고침하면 다시 로그인해야 해.
  </footer>
</main>

<script>
"use strict";

const $ = id => document.getElementById(id);

const SERVER =
  "https://calm-waterfall-aaf4.1300-chul.workers.dev";

let token = "";
let currentUser = "";
let books = [];
let coverData = "";
let busy = false;

function message(text) {
  $("message").textContent = text;
}

function setBusy(value) {
  busy = value;

  document.querySelectorAll(
    "button, input, textarea"
  ).forEach(element => {
    element.disabled = value;
  });
}

function showLogin() {
  token = "";
  currentUser = "";
  books = [];
  coverData = "";

  $("auth").hidden = false;
  $("app").hidden = true;
  $("books").replaceChildren();
  $("bookForm").reset();
  $("preview").hidden = true;
  $("preview").removeAttribute("src");
}

async function api(path, method = "GET", data) {
  const headers = {};

  if (data !== undefined) {
    headers["Content-Type"] = "application/json";
  }

  if (token) {
    headers.Authorization = "Bearer " + token;
  }

  const controller = new AbortController();
  const timeout = setTimeout(
    () => controller.abort(),
    20000
  );

  try {
    const response = await fetch(SERVER + path, {
      method,
      headers,
      ...(data !== undefined
        ? { body: JSON.stringify(data) }
        : {}),
      signal: controller.signal
    });

    let result;

    try {
      result = await response.json();
    } catch {
      throw new Error("サーバー");
    }

    if (!response.ok) {
      if (response.status === 401 && token) {
        showLogin();
      }

      throw new Error(
        result.message || "요청에 실패했어."
      );
    }

    return result;
  } catch (error) {
    if (error.name === "AbortError") {
      throw new Error("서버 응답 시간이 초과됐어.");
    }

    if (error instanceof TypeError) {
      throw new Error(
        "서버에 연결하지 못했어. 인터넷 연결과 서버 설정을 확인해 줘."
      );
    }

    if (error.message === "サーバー") {
      throw new Error("서버 응답을 읽을 수 없어.");
    }

    throw error;
  } finally {
    clearTimeout(timeout);
  }
}

function updateClock() {
  $("clock").textContent =
    new Intl.DateTimeFormat("ko-KR", {
      timeZone: "Asia/Seoul",
      dateStyle: "long",
      timeStyle: "short"
    }).format(new Date());
}

async function authenticate(signup) {
  if (busy) return;

  const username = $("username").value.trim();
  const password = $("password").value;

  if (!/^[A-Za-z0-9가-힣_-]{2,30}$/.test(username)) {
    message(
      "아이디는 한글·영문·숫자·밑줄·하이픈으로 2~30글자를 입력해 줘."
    );
    return;
  }

  if (password.length < 8 || password.length > 128) {
    message("비밀번호는 8~128글자로 입력해 줘.");
    return;
  }

  let invite;

  if (signup) {
    invite = prompt("회원가입 초대코드를 입력해 줘.");
    if (invite === null) return;
  }

  setBusy(true);
  message("서버에 연결 중…");

  try {
    const result = await api(
      signup ? "/signup" : "/login",
      "POST",
      {
        username,
        password,
        ...(signup ? { invite } : {})
      }
    );

    if (!result.token || !result.username) {
      throw new Error("로그인 응답을 확인할 수 없어.");
    }

    token = result.token;
    currentUser = result.username;
    $("password").value = "";

    const library = await api("/books");

    if (!Array.isArray(library.books)) {
      throw new Error("서재 데이터를 읽을 수 없어.");
    }

    books = library.books;
    renderBooks();

    $("auth").hidden = true;
    $("app").hidden = false;

    message(
      signup
        ? "아이디를 만들었어! 이제 책을 기록해 봐."
        : "내 서재를 불러왔어!"
    );
  } catch (error) {
    showLogin();
    message(error.message);
  } finally {
    setBusy(false);
  }
}

$("authForm").onsubmit = event => {
  event.preventDefault();
  authenticate(false);
};

$("signup").onclick = () => authenticate(true);

$("logout").onclick = () => {
  if (busy) return;
  showLogin();
  message("로그아웃했어.");
};

$("cover").onchange = async () => {
  if (busy) return;

  coverData = "";
  $("preview").hidden = true;
  $("preview").removeAttribute("src");

  const file = $("cover").files[0];
  if (!file) return;

  if (file.size > 8 * 1024 * 1024) {
    $("cover").value = "";
    message("8MB 이하 이미지를 골라 줘.");
    return;
  }

  setBusy(true);
  message("표지를 준비하는 중…");

  let imageURL;

  try {
    imageURL = URL.createObjectURL(file);

    const image = new Image();
    image.src = imageURL;
    await image.decode();

    const scale = Math.min(
      1,
      120 / Math.max(image.width, image.height)
    );

    const canvas = document.createElement("canvas");

    canvas.width = Math.max(
      1,
      Math.round(image.width * scale)
    );

    canvas.height = Math.max(
      1,
      Math.round(image.height * scale)
    );

    const context = canvas.getContext("2d");

    if (!context) {
      throw new Error("사진을 줄일 수 없어.");
    }

    context.fillStyle = "white";
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(
      image, 0, 0, canvas.width, canvas.height
    );

    const compressed = canvas.toDataURL(
      "image/jpeg",
      0.45
    );

    if (compressed.length > 12000) {
      throw new Error(
        "표지가 너무 커. 더 단순한 이미지를 골라 줘."
      );
    }

    coverData = compressed;
    $("preview").src = coverData;
    $("preview").hidden = false;

    message("표지를 준비했어!");
  } catch (error) {
    $("cover").value = "";
    message(error.message || "이미지를 열지 못했어.");
  } finally {
    if (imageURL) URL.revokeObjectURL(imageURL);
    setBusy(false);
  }
};

$("bookForm").onsubmit = async event => {
  event.preventDefault();

  if (busy || !token) return;

  const title = $("title").value.trim();
  const review = $("review").value.trim();

  if (!title) {
    message("책 제목을 입력해 줘!");
    return;
  }

  setBusy(true);
  message("서버에 저장 중…");

  try {
    const result = await api("/books", "POST", {
      title,
      review,
      cover: coverData
    });

    if (!Array.isArray(result.books)) {
      throw new Error("저장 결과를 확인할 수 없어.");
    }

    books = result.books;

    $("bookForm").reset();
    coverData = "";
    $("preview").hidden = true;
    $("preview").removeAttribute("src");

    renderBooks();
    message("서재에 저장했어!");
  } catch (error) {
    message(
      error.message +
      " 저장 여부가 불확실하면 다시 로그인해 서재를 확인해 줘."
    );
  } finally {
    setBusy(false);
  }
};

function renderBooks() {
  $("greeting").textContent = currentUser + "님의 서재";
  $("count").textContent = "독서 기록 " + books.length + "개";
  $("empty").hidden = books.length > 0;
  $("books").replaceChildren();

  for (const book of books) {
    const card = document.createElement("article");
    card.className = "book";

    const cover = document.createElement("div");
    cover.className = "cover";

    if (
      typeof book.cover === "string" &&
      /^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(
        book.cover
      )
    ) {
      const image = document.createElement("img");
      image.src = book.cover;
      image.alt = book.title + " 표지";
      cover.append(image);
    } else {
      const text = document.createElement("span");
      text.textContent = "📖 " + book.title;
      cover.append(text);
    }

    const info = document.createElement("div");
    info.className = "info";

    const title = document.createElement("h3");
    title.textContent = book.title;

    const date = document.createElement("small");
    const savedDate = new Date(book.date);

    date.textContent = Number.isNaN(savedDate.getTime())
      ? "날짜 정보 없음"
      : new Intl.DateTimeFormat("ko-KR", {
          timeZone: "Asia/Seoul",
          dateStyle: "medium",
          timeStyle: "short"
        }).format(savedDate);

    const review = document.createElement("p");
    review.textContent = book.review || "감상문이 아직 없어.";

    info.append(title, date, review);
    card.append(cover, info);
    $("books").append(card);
  }
}

updateClock();
setInterval(updateClock, 60000);
</script>
</body>
</html>
